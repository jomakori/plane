name: Build backend (arm64)

# Builds the fork's backend image on a native arm64 runner for the self-hosted
# deployment, which runs Plane v1.4.1 plus the work-item relation removal route.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push to ghcr.io
        required: true
        default: v1.4.1-relremove

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push backend image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/plane-backend:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
